name: release

# Builds the four supported `ocg` artifacts and publishes them with a
# SHA256SUMS file. Nothing is published for a normal push or a manual run:
# the release job only runs for a valid version tag.
#
# Reliability rules:
#   - `verify` runs formatting, clippy, the full Rust suite, the installer shell
#     tests and configuration validation before any build;
#   - every artifact is built on a native runner for its OS/arch, with an
#     explicit architecture assertion, a native host test run and a `version`
#     smoke test of the final artifact;
#   - the release job depends on every required job and only publishes
#     semver-compatible `vX.Y.Z` and `vX.Y.Z-rc.N` tags.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: formatting
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      # Rust is the single source of truth for the loopback control wire
      # contract. The committed TypeScript projection must match it, or the
      # PWA is typed against a contract the server does not speak.
      - name: generated contract is in sync
        run: make contracts-check
      - name: test suite
        run: cargo test --locked
      - name: installer tests
        run: sh tests/installer_test.sh
      # The generated contract is committed TypeScript, so the PWA has to
      # actually compile against it. Without this a Rust contract change that
      # breaks the frontend decoders would still ship.
      - name: frontend contract check
        working-directory: frontend
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit
          pnpm lint
          pnpm test
          pnpm build
      - name: upload embedded UI export
        uses: actions/upload-artifact@v4
        with:
          name: ocg-ui-export
          path: frontend/out
          if-no-files-found: error
      # Since v0.4.1 the repository ships no runnable provider/model, so
      # `ocg validate` in the repository root is *expected* to report a missing
      # Profile. Validate a generated placeholder Profile instead: it proves the
      # shipped configuration parses and that structural validation passes,
      # without inventing a runnable resource the project deliberately lacks.
      - name: validate shipped configuration
        run: |
          set -euo pipefail
          project="$(mktemp -d)"
          trap 'rm -rf "$project"' EXIT
          cargo run --quiet --locked -- --project "$project" init
          cargo run --quiet --locked -- --project "$project" validate
          # A placeholder Profile must be structurally valid yet never runnable.
          if cargo run --quiet --locked -- --project "$project" run "hello" 2>"$project/err"; then
            echo "placeholder Profile must not be runnable" >&2
            exit 1
          fi
          grep -q "No runnable provider/model configured" "$project/err"

  build-linux:
    needs: verify
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            artifact: ocg-linux-x86_64
            runner: ubuntu-24.04
            host_arch: x86_64
          - target: aarch64-unknown-linux-musl
            artifact: ocg-linux-arm64
            runner: ubuntu-24.04-arm
            host_arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: assert native runner architecture
        run: test "$(uname -m)" = "${{ matrix.host_arch }}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
      - name: download embedded UI export
        uses: actions/download-artifact@v4
        with:
          name: ocg-ui-export
          path: frontend/out
      # The native host tests must pass before the artifact is built. The runner
      # matches the target architecture, so this is a real native run.
      - name: native host tests
        run: cargo test --locked
      - name: build ${{ matrix.target }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: smoke-run the final artifact
        run: |
          cp target/${{ matrix.target }}/release/ocg ${{ matrix.artifact }}
          ./${{ matrix.artifact }} version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  build-darwin:
    needs: verify
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            artifact: ocg-darwin-arm64
            runner: macos-15
            host_arch: arm64
          - target: x86_64-apple-darwin
            artifact: ocg-darwin-x86_64
            runner: macos-15-intel
            host_arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: assert native runner architecture
        run: test "$(uname -m)" = "${{ matrix.host_arch }}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: download embedded UI export
        uses: actions/download-artifact@v4
        with:
          name: ocg-ui-export
          path: frontend/out
      - name: native host tests
        run: cargo test --locked
      - name: build ${{ matrix.target }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: smoke-run the final artifact
        run: |
          cp target/${{ matrix.target }}/release/ocg ${{ matrix.artifact }}
          ./${{ matrix.artifact }} version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  # Publishes only for a `v*` tag. `-rc.*` tags are prereleases.
  release:
    needs: [verify, build-linux, build-darwin]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
            echo "Unsupported release tag: $RELEASE_TAG" >&2
            echo "Expected vX.Y.Z or vX.Y.Z-rc.N" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums of the final artifacts
        run: |
          cd dist
          sha256sum ocg-* > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ocg-release-bundle
          path: dist/*
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        with:
          name: OCG ${{ github.ref_name }}
          files: dist/*
          prerelease: ${{ contains(github.ref, '-rc.') }}
          body: |
            OCG ${{ github.ref_name }}

            OCG is a project-agnostic orchestration Core with a PWA control
            surface.

            Core

            - Rust-owned durable contracts, missions, execution state and
              verification.
            - A versioned loopback control API used by the PWA.
            - Provider-neutral routing and execution boundaries.
            - Local repository context, bounded telemetry and replayable state.

            PWA

            - Static exported UI embedded into each release artifact.
            - Rust-owned TypeScript contracts with generated decoders.
            - Mission control, execution projections, logs and resource views.

            Reliability

            - Every artifact is built on its native OS and architecture runner.
            - The release gate covers Rust formatting, linting, tests, contract
              synchronization, installer tests and the complete PWA check.
            - Each final binary passes an architecture assertion and version
              smoke test before publication.

            Install

            ```bash
            curl -fsSL https://raw.githubusercontent.com/18601673727/ocg/main/install.sh | sh
            ```

            The unpinned installer follows the latest stable release. To pin
            this release explicitly:

            ```bash
            OCG_VERSION=${{ github.ref_name }} sh install.sh
            ```
