name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Install Rust 1.99.1
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
      - run: cargo fmt --all --check
      - run: cargo build --locked
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked -- -D warnings

  browser-regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Install Rust 1.99.1
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - run: cargo build --locked --bin ocg
      - run: cargo run --locked --bin ocg-rs-ts
      - name: Build Solid UI
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm build
      - name: Install browser regression dependencies
        working-directory: benchmark/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Stage release-style UI layout
        run: |
          mkdir -p "$RUNNER_TEMP/ocg-staged"
          cp target/debug/ocg "$RUNNER_TEMP/ocg-staged/ocg"
          cp -R frontend/out "$RUNNER_TEMP/ocg-staged/ui"
          test -f "$RUNNER_TEMP/ocg-staged/ui/index.html"
      - name: Archive and scroll regression against packaged layout
        working-directory: benchmark/frontend
        env:
          OCG_BENCH_BACKEND: ${{ runner.temp }}/ocg-staged/ocg
          OCG_BENCH_UI_DIR: ${{ runner.temp }}/ocg-staged/ui
        run: pnpm regression
      - name: Upload failing backend log
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: browser-regression-log
          path: /tmp/ocg-browser-regression-*/rust.log
          if-no-files-found: ignore
